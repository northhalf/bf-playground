name: Build desktop & mobile apps

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    environment:
      name: deploy
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: bf_playground-windows-x64
            build: flutter build windows --release
            pack: cd build/windows/x64/runner/Release && 7z a -r "$GITHUB_WORKSPACE/bf_playground-windows-x64.zip" *
            package: bf_playground-windows-x64.zip
          - os: windows-11-arm
            artifact: bf_playground-windows-arm64
            build: flutter build windows --release
            pack: cd build/windows/arm64/runner/Release && 7z a -r "$GITHUB_WORKSPACE/bf_playground-windows-arm64.zip" *
            package: bf_playground-windows-arm64.zip
          - os: macos-latest
            artifact: bf_playground-macos-arm64
            build: flutter build macos --release
            # Zip the .app: bare bundles lose their symlinks in artifacts.
            pack: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/bf_playground.app bf_playground-macos-arm64.zip
            package: bf_playground-macos-arm64.zip
          - os: macos-15-intel
            artifact: bf_playground-macos-x64
            build: flutter build macos --release
            pack: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/bf_playground.app bf_playground-macos-x64.zip
            package: bf_playground-macos-x64.zip
          - os: ubuntu-latest
            artifact: bf_playground-linux-x64
            pre: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            build: flutter build linux --release
            pack: tar -czf bf_playground-linux-x64.tar.gz -C build/linux/x64/release bundle
            package: bf_playground-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            artifact: bf_playground-linux-arm64
            pre: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            build: flutter build linux --release
            pack: tar -czf bf_playground-linux-arm64.tar.gz -C build/linux/arm64/release bundle
            package: bf_playground-linux-arm64.tar.gz
          - os: ubuntu-latest
            artifact: bf_playground-android
            build: flutter build apk --release
            pack: cp build/app/outputs/flutter-apk/app-release.apk bf_playground-android.apk
            package: bf_playground-android.apk
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install platform dependencies
        if: matrix.pre != null
        run: ${{ matrix.pre }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build
        run: ${{ matrix.build }}
      - name: Package
        run: ${{ matrix.pack }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    # Only tag pushes cut a release; manual runs just produce artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bf_playground-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/bf_playground-*
          generate_release_notes: true
